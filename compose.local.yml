name: wearup-local

services:
  mysql:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wearup_local}
      MYSQL_USER: ${MYSQL_USER:-wearup}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.local}
      TZ: Asia/Seoul
    ports:
      # - PC에서만 접속, 다른 기기에는 DB 포트를 열지 않음
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # - 새 DB 볼륨에서만 스키마와 필수 기준 데이터 초기화
      - ./ERD/wearup_ddl.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/mysql/02-reference-data.sql:/docker-entrypoint-initdb.d/02-reference-data.sql:ro
    healthcheck:
      # - 초기화용 임시 서버가 끝난 뒤 TCP 접속과 테이블 조회 확인
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --silent --execute="SELECT COUNT(*) FROM Authority"'
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 24

  app:
    image: wearup-local:dev
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # - 기존 application.yml의 prod 지정과 외부 설정은 로컬 실행에서 제외
      SPRING_CONFIG_LOCATION: classpath:/application.properties,classpath:/application-local.yml
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: mysql
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wearup_local}
      MYSQL_USER: ${MYSQL_USER:-wearup}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.local}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      # - 앱을 다시 만들어도 업로드 파일은 유지
      - uploads:/app/upload
    healthcheck:
      # - 로그인 페이지 응답 확인, 실제 DB CRUD 성공 여부는 별도 검증
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/login"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

volumes:
  mysql-data:
  uploads:
