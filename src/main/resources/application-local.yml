# - AWS·소셜 로그인 키 없이 일반 회원·브랜드 로그인으로 실행
server:
  port: 8080

spring:
  application:
    name: WEARUP
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${MYSQL_DATABASE:wearup_local}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:wearup}
    password: ${MYSQL_PASSWORD}
  thymeleaf:
    cache: false
  servlet:
    multipart:
      # - 기존 업로드 한도 유지, 실제 형식·자원 제한은 후속 보완
      max-file-size: 1000MB
      max-request-size: 1000MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  oauth2:
    enabled: false
  upload:
    path:
      post: ${UPLOAD_POST_PATH:upload/post}
      item: ${UPLOAD_ITEM_PATH:upload/item}
      brand: ${UPLOAD_BRAND_PATH:upload/brand}
